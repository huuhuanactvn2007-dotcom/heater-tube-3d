<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heater Tube DN300 SCH10 - SUS304</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e2a33; font-family: Arial, sans-serif; }
  #c3d { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #ui button { padding: 8px 12px; border: 1px solid #5b7080; background: #2b3b47; color: #fff; border-radius: 6px; cursor: pointer; }
  #ui button:hover { background: #38505f; }
  #ui span { color: #b8c4cc; font-size: 13px; }
  #info { position: fixed; bottom: 12px; left: 12px; color: #dfe7ec; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="ui">
  <button id="bAuto">Dừng tự xoay</button>
  <button id="bIso">Góc nhìn 3D</button>
  <button id="bSide">Nhìn ngang</button>
  <button id="bFront">Nhìn mặt bích</button>
  <span>Kéo chuột để xoay, cuộn để thu phóng</span>
</div>
<div id="info">Heater Tube<br>Material: SUS304<br>Q'ty: 1 Pc</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
var canvas = document.getElementById('c3d');
var renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x1e2a33, 1);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(35, 1, 10, 20000);

function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
var d1 = new THREE.DirectionalLight(0xffffff, 0.9); d1.position.set(800, 1200, 900); scene.add(d1);
var d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-900, -300, -700); scene.add(d2);

var steel = new THREE.MeshStandardMaterial({color: 0xc4cad0, metalness: 0.55, roughness: 0.38, side: THREE.DoubleSide});
var flangeMat = new THREE.MeshStandardMaterial({color: 0xb4bbc2, metalness: 0.55, roughness: 0.42});
var stubMat = new THREE.MeshStandardMaterial({color: 0xd0d5da, metalness: 0.6, roughness: 0.3});
var g = new THREE.Group();

var R = 161.95, L = 1128.8, DOME = 274.1;

var pipe = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L, 72, 1, true), steel);
pipe.rotation.z = -Math.PI / 2; pipe.position.x = L / 2; g.add(pipe);

var prof = [];
for (var i = 0; i <= 40; i++) {
  var a = i / 40 * Math.PI / 2;
  prof.push(new THREE.Vector2(Math.max(R * Math.cos(a), 0.01), DOME * Math.sin(a)));
}
var cap = new THREE.Mesh(new THREE.LatheGeometry(prof, 72), steel);
cap.rotation.z = -Math.PI / 2; cap.position.x = L; g.add(cap);

function plate(ro, ri, depth, x, holes) {
  var s = new THREE.Shape(); s.absarc(0, 0, ro, 0, Math.PI * 2, false);
  var h = new THREE.Path(); h.absarc(0, 0, ri, 0, Math.PI * 2, true); s.holes.push(h);
  if (holes) {
    for (var k = 0; k < 16; k++) {
      var an = k / 16 * Math.PI * 2, hp = new THREE.Path();
      hp.absarc(Math.cos(an) * holes.pcd, Math.sin(an) * holes.pcd, holes.r, 0, Math.PI * 2, true);
      s.holes.push(hp);
    }
  }
  var m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, {depth: depth, bevelEnabled: false, curveSegments: 48}), flangeMat);
  m.rotation.y = Math.PI / 2; m.position.x = x; return m;
}

var T = 24, GAP = 55;
g.add(plate(222.5, R, T, 0, {pcd: 200, r: 11.5}));
g.add(plate(222.5, R, T, T + GAP, {pcd: 200, r: 11.5}));

var sx = T + GAP / 2;
[1, -1].forEach(function(sg){
  var st = new THREE.Mesh(new THREE.CylinderGeometry(17, 17, 100, 32), stubMat);
  st.position.set(sx, sg * 200, 0); g.add(st);
  for (var k = 0; k < 5; k++) {
    var t = new THREE.Mesh(new THREE.TorusGeometry(17.4, 1.3, 8, 32), stubMat);
    t.rotation.x = Math.PI / 2; t.position.set(sx, sg * (228 + k * 5), 0); g.add(t);
  }
  var hole = new THREE.Mesh(new THREE.CircleGeometry(10, 24), new THREE.MeshBasicMaterial({color: 0x222222}));
  hole.rotation.x = -sg * Math.PI / 2; hole.position.set(sx, sg * 250.2, 0); g.add(hole);
});

g.position.x = -(L + DOME) / 2 + 120;
scene.add(g);

var ctl = new THREE.OrbitControls(camera, canvas);
ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 1.2;
function view(x, y, z){ camera.position.set(x, y, z); ctl.target.set(0, 0, 0); ctl.update(); }
view(900, 550, 1300);

var bAuto = document.getElementById('bAuto');
function stopAuto(){ ctl.autoRotate = false; bAuto.textContent = 'Bật tự xoay'; }
bAuto.onclick = function(){ ctl.autoRotate = !ctl.autoRotate; bAuto.textContent = ctl.autoRotate ? 'Dừng tự xoay' : 'Bật tự xoay'; };
document.getElementById('bIso').onclick = function(){ view(900, 550, 1300); };
document.getElementById('bSide').onclick = function(){ stopAuto(); view(0, 0, 1900); };
document.getElementById('bFront').onclick = function(){ stopAuto(); view(-1900, 60, 60); };

(function loop(){ requestAnimationFrame(loop); ctl.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
